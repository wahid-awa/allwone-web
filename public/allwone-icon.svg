      <stop offset="20%" stop-color="#e58440"/>
      <stop offset="40%" stop-color="#f5da58"/>
      <stop offset="60%" stop-color="#479558"/>
      <stop offset="80%" stop-color="#1a6fa3"/>
      <stop offset="100%" stop-color="#6f3877"/>
    </linearGradient>
