<svg xmlns="http://www.w3.org/2000/svg" viewBox="1320 790 260 320" class="w-full h-full">
  <defs>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#d03736" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#e58440" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
