    <rect id="sq-5" fill="#1a6fa3" x="1492.99" y="810.04" width="24.96" height="24.96" rx="2" />
    <rect id="sq-6" fill="#6f3877" x="1529.04" y="810.04" width="24.96" height="24.96" rx="2" />
